<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>PARKVISION · Admin login</title>
<style>:root{color-scheme:dark;--bg:#0b1220;--panel:#17253b;--line:#30435f;--text:#eef5ff;--muted:#a9bad1;--blue:#70afff;--red:#ff9aa2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 0%,#203957,#0b1220 52%);color:var(--text);font:15px/1.5 system-ui,sans-serif}.card{width:min(420px,calc(100% - 30px));padding:25px;border:1px solid var(--line);border-radius:20px;background:var(--panel);box-shadow:0 20px 55px #0005}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--blue);font-weight:800}h1{margin:5px 0 6px}p{color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:17px 0 6px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:#0b1728;color:var(--text);font:inherit}.btn{margin-top:16px;width:100%;padding:13px;border:0;border-radius:11px;background:linear-gradient(120deg,#5baaff,#5869e9);color:white;font-weight:800;font:inherit}.error{padding:10px;border:1px solid #84424a;border-radius:10px;color:var(--red);font-size:13px}</style></head>
<body><main class="card"><div class="eyebrow">PARKVISION CONTROL</div><h1>Administrator login</h1><p>Sign in to open the entrance station and manage bay reservations.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post"><label for="password">Administrator password</label><input id="password" name="password" type="password" required autocomplete="current-password"><button class="btn" type="submit">Sign in</button></form></main></body></html>
